server:
  port: 8065

spring:
  application:
    name: eureka-server
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://configserver:8085/"
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/